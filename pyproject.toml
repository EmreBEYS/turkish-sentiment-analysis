[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-sentiment-analysis"
version = "0.1.0"
description = "Turkish sentiment classification coursework: classical ML and BERT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "seaborn>=0.13,<1",
]

[project.optional-dependencies]
bert = [
  "accelerate>=0.28,<2",
  "datasets>=2.18,<4",
  "evaluate>=0.4,<1",
  "torch>=2.2,<3",
  "transformers>=4.39,<5",
]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

